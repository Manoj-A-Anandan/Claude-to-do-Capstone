<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TODO</title>
  <link rel="stylesheet" href="src/styles.css">
</head>
<body>
  <main class="app">
    <h1>TODO</h1>

    <form id="task-form">
      <label for="title-input">Task title</label>
      <div class="form-row">
        <input id="title-input" name="title" type="text" autocomplete="off">
        <button type="submit">Add Task</button>
      </div>
    </form>

    <div class="messages">
      <div id="title-error" class="message message-error" role="alert"></div>
      <div id="warning" class="message message-warning" role="status"></div>
    </div>
    <div id="confirmation" class="visually-hidden" role="status"></div>

    <ul id="task-list" class="task-list" aria-label="Tasks"></ul>
  </main>

  <script src="src/task-validator.js"></script>
  <script src="src/task-store.js"></script>
  <script src="src/task-service.js"></script>
  <script src="src/task-view.js"></script>
  <script src="src/app.js"></script>
  <script>Todo.startApp({ document: document, getStorage: function () { return window.localStorage; } });</script>
</body>
</html>
